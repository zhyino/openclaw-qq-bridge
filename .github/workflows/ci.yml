name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      # The manifest schema is the only config contract that exists at
      # runtime; a field typed in src/types.ts but missing here cannot be
      # configured at all (additionalProperties: false).
      - name: Manifest field guard
        run: npm run manifest:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # Only production dependencies matter at runtime; dev-tool advisories
      # must not block a release, but production ones must.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
